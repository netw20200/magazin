<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>magazin</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-header">

    <button class="menu-btn" aria-label="Меню">
        <span class="material-symbols-outlined">menu</span>
    </button>

    <div class="logo">

        <span class="material-symbols-outlined logo-icon">
            shopping_bag
        </span>

        <span class="logo-text">
            magazin
        </span>

    </div>

    <div class="header-right">

        <button class="icon-btn" aria-label="Профиль">
            <span class="material-symbols-outlined">
                person
            </span>
        </button>

        <button class="cart-btn" aria-label="Корзина">

            <span class="material-symbols-outlined">
                shopping_bag
            </span>

            <span id="cart-count">0</span>

        </button>

    </div>

</header>
<div class="overlay"></div>

<nav class="side-menu">

    <div class="side-header">
        <span>Меню</span>

        <button class="close-menu">
            <span class="material-symbols-outlined">
                close
            </span>
        </button>
    </div>

<a href="#">
    <span class="material-symbols-outlined">home</span>
    <span>Главная</span></a>
<a href="#">
    <span class="material-symbols-outlined">storefront</span>
    <span>Каталог</span></a>
<a href="#">
    <span class="material-symbols-outlined">local_offer</span>
    <span>Акции</span></a>
<a href="#">
    <span class="material-symbols-outlined">call</span>
    <span>Контакты</span></a>
<a href="#">
    <span class="material-symbols-outlined">photo_camera</span>
    <span>Instagram</span></a>

</nav>
<section class="search-wrapper">

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Поиск товаров..."
            autocomplete="off">

    </div>
</section>



<section class="hero-banner">

    <img src="images/banner.webp" alt="Баннер">

</section>


    
    <section class="hero-slider">

<div class="swiper mySwiper">

<div class="swiper-wrapper">

<div class="swiper-slide">
<img src="images/slide1.webp">
</div>

<div class="swiper-slide">
<img src="images/slide2.webp">
</div>

<div class="swiper-slide">
<img src="images/slide3.webp">
</div>

<div class="swiper-slide">
<img src="images/slide4.webp">
</div>

<div class="swiper-slide">
<img src="images/slide5.webp">
</div>

</div>

<div class="swiper-pagination"></div>

</div>

</section>


    
<main>

<div id="products" class="products">

    <div class="loading">

        Загрузка товаров...

    </div>

</div>

</main>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
