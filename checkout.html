<body>

<!-- ===== ОФОРМЛЕНИЕ ЗАКАЗА ===== -->

<div class="checkout">

<h2>Оформлення замовлення</h2>

<input
type="text"
id="customer-name"
placeholder="Ваше ім'я">

<input
type="tel"
id="customer-phone"
placeholder="Телефон">
<h3>Спосіб отримання</h3>

<div class="delivery-select">

<div class="delivery-card active" id="pickup-card">

<span class="material-symbols-outlined">storefront</span>

<span>Самовивіз</span>

<input
type="radio"
name="delivery"
value="pickup"
checked
hidden>

</div>

<div class="delivery-card" id="nova-card">

<span class="material-symbols-outlined">local_shipping</span>

<span>Нова Пошта</span>

<input
type="radio"
name="delivery"
value="nova"
hidden>

</div>

</div>

<div id="nova-fields" style="display:none;">

<input
type="text"
id="customer-city"
placeholder="Місто">

<input
type="text"
id="customer-branch"
placeholder="Відділення або поштомат">

</div>
  
<textarea
id="customer-comment"
placeholder="Коментарій до замовлення"></textarea>


<!-- ===== ТОВАРЫ В ЗАКАЗЕ ===== -->

<h3>Ваше замовлення</h3>

<div id="checkout-cart"></div>

<div id="checkout-total"></div>  
  
<button
class="checkout-btn"
onclick="sendOrder()">

Відправка замовлення 

</button>

<button
class="cancel-btn"
onclick="history.back()">

Назад

</button>

</div>
<footer class="footer">

    <div class="footer-grid">

        <div>
            <h3>Контакти</h3>

            <a href="tel:+380000000000">
                <i class="fa-solid fa-phone"></i>
                +38 (000) 000-00-00
            </a>

            <a href="mailto:info@magazin.ua">
                <i class="fa-solid fa-envelope"></i>
                info@magazin.ua
            </a>

        </div>

        <div>
            <h3>Покупцям</h3>

            <a href="#">
                <i class="fa-solid fa-truck-fast"></i>
                Доставка
            </a>

            <a href="#">
                <i class="fa-solid fa-credit-card"></i>
                Оплата
            </a>

        </div>

    </div>
    
<div class="footer-social">

        <a href="https://t.me/" target="_blank">
            <i class="fa-brands fa-telegram"></i>
        </a>

        <a href="https://instagram.com/" target="_blank">
            <i class="fa-brands fa-instagram"></i>
        </a>

        <a href="#">
            <i class="fa-brands fa-facebook-f"></i>
        </a>

</div>
    
 <div class="footer-copy">

</footer>
