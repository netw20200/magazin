<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Оформление заказа</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===== ОФОРМЛЕНИЕ ЗАКАЗА ===== -->

<div class="checkout">

<h2>Оформление заказа</h2>

<input
type="text"
id="customer-name"
placeholder="Ваше имя">

<input
type="tel"
id="customer-phone"
placeholder="Телефон">
<h3>Спосіб отримання</h3>

<label class="delivery-option">
<input type="radio"
name="delivery"
value="pickup"
checked>

Самовивіз

</label>

<label class="delivery-option">

<input type="radio"
name="delivery"
value="nova">

Нова Пошта

</label>

<div id="nova-fields" style="display:none;">

<input
type="text"
id="customer-city"
placeholder="Місто">

<input
type="text"
id="customer-branch"
placeholder="Відділення або поштомат">

</div>
  
<textarea
id="customer-comment"
placeholder="Комментарий к заказу"></textarea>


<!-- ===== ТОВАРЫ В ЗАКАЗЕ ===== -->

<h3>Ваш заказ</h3>

<div id="checkout-cart"></div>

<div id="checkout-total"></div>  
  
<button
class="checkout-btn"
onclick="sendOrder()">

Отправить заказ

</button>

<button
class="cancel-btn"
onclick="history.back()">

Назад

</button>

</div>

<script src="checkout.js"></script>

</body>

</html>
