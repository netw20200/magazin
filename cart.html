<div class="logo">
Кошик
</div>

<div style="width:40px"></div>

</header>

<!-- ===== СПИСОК ТОВАРОВ ===== -->

Кошик порожній
</p>

    <button class="btn checkout-btn"

    </button>

    <button class="btn cancel-btn"
        onclick="cancelOrder()">

        Відмінити замовлення
