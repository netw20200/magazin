<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Корзина</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===== ШАПКА КОРЗИНЫ ===== -->

<header class="top-header">

<button onclick="location.href='index.html'" class="icon-btn">
<span class="material-symbols-outlined">arrow_back</span>
</button>

<div class="logo">
Корзина
</div>

<div style="width:40px"></div>

</header>

<!-- ===== СПИСОК ТОВАРОВ ===== -->

<div id="cart-items" class="cart-items">

<p style="text-align:center;padding:40px;">
Корзина пока пуста
</p>

</div>

<!-- ===== ИТОГО ===== -->

<div class="cart-total">

<h2>Итого:
<span id="total-price">0 ₴</span>
</h2>
<h3>🚚 Доставка</h3>

<div class="checkout-form">

<input type="text" id="customer-name" placeholder="Ваше ім'я">

<input type="tel" id="customer-phone" placeholder="Телефон">

<input type="text" id="customer-city" placeholder="Місто">

<input type="text" id="customer-branch" placeholder="Відділення або поштомат Нової Пошти">

<select id="payment-method">
<option value="Післяплата">Післяплата</option>
<option value="Картка">Оплата на картку</option>
<option value="IBAN">Оплата за IBAN</option>
</select>

</div>
</div>


<!-- ===== ОФОРМЛЕНИЕ ЗАКАЗА ===== -->

<div class="cart-actions">

    <button class="btn checkout-btn"
        onclick="checkout()">

        Оформить заказ

    </button>

    <button class="btn cancel-btn"
        onclick="cancelOrder()">

        Отменить заказ

    </button>

</div>
<script src="cart.js"></script>

</body>
</html>
